<text x="109.5" y="146" font-family="DejaVu Sans" font-size="3" fill="#243441" text-anchor="middle" transform="rotate(-90 109.5 146)">13 — centru attālums</text>
<text x="68" y="148" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="middle">S02 gals</text>
<text x="38" y="240" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P03: 8 gab.; 16 × 6 × 0,8.</text>
<text x="38" y="246" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">2 urbumi Ø1,3; X platuma centrā.</text>
<text x="38" y="252" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Centri 1,5 no augšas un apakšas.</text>
<text x="38" y="258" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P03 centrēta pret S02 galu.</text>
<text x="140" y="57" font-family="DejaVu Sans" font-size="3.2" fill="#243441" text-anchor="start" font-weight="bold">IZVIETOJUMS UN MONTĀŽA</text>
<text x="140" y="68" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Fiksētā P03 piemetināta kājas iekšējai plaknei.</text>
<text x="140" y="74.4" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Noņemamā P03 piemetināta S02 galam.</text>
<text x="140" y="80.8" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Pa divām M12 skrūvēm, garums 3,5; paplāksne 0,25.</text>
<text x="140" y="87.2" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Uzgrieznis fiksētās P03 aizmugurē, kājas caurulē.</text>
<text x="140" y="93.6" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Pirms metināšanas kājas sienā izveidot divas Ø3 atveres.</text>
<text x="140" y="100" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Skrūves ievietot no plaukta puses; asis Y virzienā.</text>
<text x="140" y="106.4" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start"></text>
<text x="140" y="112.8" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">P03: Z=11–27; urbumu centri Z=12,5 un 25,5.</text>
<text x="140" y="119.2" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">No kājas caurules apakšas: P03 apakša 7,2;</text>
<text x="140" y="125.6" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">urbumu centri 8,7 un 21,7. Caurules apakša Z=3,8.</text>
<text x="140" y="132" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start"></text>
<text x="140" y="138.4" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Kājām pie Y=20: fiksētā P03 Y=23–23,8;</text>
<text x="140" y="144.8" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">noņemamā P03 Y=23,8–24,6.</text>
<text x="140" y="151.2" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Kājām pie Y=105: fiksētā P03 Y=101,2–102;</text>
<text x="140" y="157.6" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">noņemamā P03 Y=100,4–101,2.</text>
<text x="140" y="164" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start"></text>
<text x="140" y="170.4" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Kāju iekšējo plakņu attālums: 79.</text>
<text x="140" y="176.8" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">0,8 + 0,8 + 75,8 + 0,8 + 0,8 = 79.</text>
<text x="140" y="183.2" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">M12 saķerei aiz fiksētās plāksnes paliek 1,65.</text>
<text x="140" y="189.6" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">Uzgriežņa un šuves apvalku pārbaudīt pirms urbšanas.</text>
<text x="140" y="240" font-family="DejaVu Sans" font-size="2.7" fill="#243441" text-anchor="start">P03 sānu šuves nepārtrauktas pa visu pieejamo garumu.</text>
<text x="140" y="246" font-family="DejaVu Sans" font-size="2.7" fill="#243441" text-anchor="start">S02 gala šuve pie noņemamās P03 pa visu caurules perimetru.</text>
<text x="140" y="252" font-family="DejaVu Sans" font-size="2.7" fill="#243441" text-anchor="start">Montēt šablonā; plāksnēm cieši jāsaskaras bez siju piespiedu liekšanas.</text>
<text x="140" y="258" font-family="DejaVu Sans" font-size="2.7" fill="#243441" text-anchor="start">Galīgo metinājumu un savienojumu pārbauda kompetents izgatavotājs.</text>
</svg>