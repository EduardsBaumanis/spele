<text x="105" y="247.5" font-family="DejaVu Sans" font-size="3" fill="#243441" text-anchor="middle">54 — S02 starp kājām</text>
<text x="105" y="194.7" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="middle">S02 · 8 vertikāli</text>
<text x="229" y="57" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">1. IZVEIDOT DIVUS VIENĀDUS GALUS</text>
<text x="229" y="64" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pa divām kājām un vienai S02 sijai.</text>
<text x="229" y="71" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">S02 apakša 11,2 virs kājas caurules apakšgala.</text>
<text x="229" y="78" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Ar pēdām tas ir Z=15; sijas augša Z=23.</text>
<text x="229" y="85" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Izmantot vienādus atgriezumus kā starplikas.</text>
<text x="229" y="92" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start"></text>
<text x="229" y="99" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">2. SAVIENOT GALUS AR GARSIJĀM</text>
<text x="229" y="106" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Divas S01, garums 156; 8 vertikāli.</text>
<text x="229" y="113" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Sijas X=22–178; Y=32,5–36,5 un 63,5–67,5.</text>
<text x="229" y="120" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pagaidām tikai pieķert; pārbaudīt taisnleņķus.</text>
<text x="229" y="127" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start"></text>
<text x="229" y="134" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">3. IEVIETOT 13 ŠĶĒRSLĪSTES</text>
<text x="229" y="141" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Garums 27; 4 vertikāli; augša vienā līmenī.</text>
<text x="229" y="148" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">6 cm atgriezums kalpo kā spraugas šablons.</text>
<text x="229" y="155" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start"></text>
<text x="229" y="162" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">4. PĀRBAUDĪT UN SAMETINĀT</text>
<text x="229" y="169" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Kāju centru diagonāles 170,88; starpība ≤0,2.</text>
<text x="229" y="176" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">P01 plāksnes vienā plaknē uz līdzenas pamatnes.</text>
<text x="229" y="183" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Metināt pārmaiņus pretējās pusēs.</text>
<text x="229" y="190" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">S02 galus sametināt ar kājām pa perimetru.</text>
<text x="229" y="197" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pieķeršanas punkti nav gatavs savienojums.</text>
<text x="23" y="61" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">SKATS NO GALA · 1:5,88</text>
<text x="23" y="67" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Vienādi gala mezgli pie X=20 un 180.</text>
<text x="23" y="73" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Abu cauruļu sienas 0,3; piegulošus galus</text>
<text x="23" y="79" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">piegriezt pēc faktiskās ailes.</text>
<text x="229" y="218" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">PIRMS KRĀSOŠANAS</text>
<text x="229" y="225" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Apskatīt šuves; pārbaudīt pamatni uz grīdas.</text>
<text x="229" y="232" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Šaubīgas šuves parādīt pieredzējušam metinātājam.</text>
<text x="229" y="239" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pamatne ir viena detaļa: 180 × 80 plānā.</text>
<text x="229" y="246" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Durvju aili un pārvietošanas ceļu pārbaudīt iepriekš.</text>
</svg>