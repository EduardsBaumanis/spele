<text x="14" y="16" font-family="DejaVu Sans" font-size="3.1" fill="#77858e" text-anchor="start" font-weight="bold">DARBNĪCA / KERAMIKAS GALDS</text>
<text x="14" y="26" font-family="DejaVu Sans" font-size="6.2" fill="#243441" text-anchor="start" font-weight="bold">Viengabala pamatnes montāža</text>
<text x="14" y="34" font-family="DejaVu Sans" font-size="2.7" fill="#77858e" text-anchor="start">Taisni profilu gali · Gala sijas metina tieši pie kājām · Nav plaukta skrūvju vai slēptu uzgriežņu</text>
