<text x="185" y="94" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pa vienai ribai X un Y virzienā.</text>
<text x="185" y="100" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Ribas šuves pie kājas un plāksnes abās pusēs.</text>
<text x="185" y="245" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P02: 6 × 6 × 0,8; Ø1,8 centrā; M16 uzgrieznis augšpusē.</text>
<text x="185" y="251" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Uzgriezni piemetina pie atsevišķas P02, tad P02 pie kājas.</text>
<text x="185" y="257" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">4 regulējamas gumijotas pēdas; fiksēt ar kontruzgriežņiem.</text>
