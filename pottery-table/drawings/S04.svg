<text x="31" y="221" font-family="DejaVu Sans" font-size="2.9" fill="#243441" text-anchor="start">Centri 3 no malām; kāja centrā.</text>
<text x="31" y="228" font-family="DejaVu Sans" font-size="2.9" fill="#243441" text-anchor="start">Parādīts stūris X=20; Y=20.</text>
<text x="31" y="235" font-family="DejaVu Sans" font-size="2.9" fill="#243441" text-anchor="start">Ribas vērstas uz galda vidu.</text>
