<text x="20" y="192" font-family="DejaVu Sans" font-size="3.3" fill="#243441" text-anchor="start" font-weight="bold">AUGSTUMI NO GRĪDAS</text>
<text x="20" y="203" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">78 — gluda darba virsma bez caurejošiem urbumiem</text>
<text x="20" y="210" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">73 — virsmas apakša un P01 augša</text>
<text x="20" y="217" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">72,2 — P01 apakša un L01 augša</text>
<text x="20" y="224" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">66,2 — mazo ribu P05 apakšpunkts</text>
<text x="20" y="231" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">L01 garums 68,4; P01 biezums 0,8</text>
<text x="20" y="238" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">3,8 — kājas caurules apakša</text>
<text x="20" y="245" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">3 — P02 apakša; 0 — grīda</text>
<text x="20" y="252" font-family="DejaVu Sans" font-size="2.85" fill="#243441" text-anchor="start">3 + 0,8 + 68,4 + 0,8 + 5 = 78</text>
<text x="211" y="192" font-family="DejaVu Sans" font-size="3.3" fill="#243441" text-anchor="start" font-weight="bold">PLAUKTS UN REGULĒŠANA</text>
<text x="211" y="203" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">23 — plaukta metāla balsta virsma.</text>
<text x="211" y="210" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">23 — plaukta tērauda augša; 15 — siju apakša.</text>
<text x="211" y="217" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Gala šķērssijas atrodas pie X=20 un 180.</text>
<text x="211" y="224" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pirms griešanas pārbaudīt krēslus un vietu pēdām.</text>
<text x="211" y="231" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start"></text>
<text x="211" y="238" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Balsta augstums = 8 − faktiskais virsmas biezums t.</text>
<text x="211" y="245" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pie t=4,81–5,15: balsts 3,19–2,85.</text>
<text x="211" y="252" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Tērauda augstumi mainās par 5 − t; skatīt aprakstu.</text>
</svg>