<text x="18" y="239" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Kāju centru diagonāle: 226,55; diagonāļu starpība ≤0,2. P01 līdzenums ≤0,05 katrai plāksnei.</text>
<text x="18" y="245" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Visām P01 cieši jābalsta virsma; spraugas koriģēt ar cietām pilnas saskares starplikām.</text>
<text x="18" y="251" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Nav perimetra siju vai centrālo šķērssiju. Plaukts savieno visas četras kājas zemāk.</text>
<text x="18" y="257" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Tukša galda stingrību pārbaudīt abos virzienos un stūros: 300 N; sānnobīdes mērķis ≤0,1.</text>
