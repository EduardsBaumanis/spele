<text x="328" y="131.9" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Bez mīkstas starplikas.</text>
<text x="328" y="137.2" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Kāju galvas: S04.</text>
<text x="18" y="239" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Kāju centru diagonāle: 170,88; diagonāļu starpība ≤0,2. Plāksnēm cieši jābalsta virsma.</text>
<text x="18" y="245" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Visām P01 cieši jābalsta virsma; spraugas koriģēt ar cietām pilnas saskares starplikām.</text>
<text x="18" y="251" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Nav perimetra siju vai centrālo šķērssiju. Plaukts savieno visas četras kājas zemāk.</text>
<text x="18" y="257" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="start">Pārbaudīt tukšu galdu: stingri spiežot abos virzienos, nav šūpošanās, klikšķu vai slīdēšanas.</text>
