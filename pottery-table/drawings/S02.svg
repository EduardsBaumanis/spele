<text x="328" y="94.8" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">X=20 un 180</text>
<text x="328" y="100.1" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Y=20 un 80</text>
<text x="328" y="105.4" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start"></text>
<text x="328" y="110.7" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">4 kokskrūves katrā P01.</text>
<text x="328" y="116" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Urbumu kvadrāts 14 × 14.</text>
<text x="328" y="121.3" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Plāksnes augša Z=73.</text>
