<text x="128" y="202" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">M10 gremdgalvas skrūve 7,5 KOPĀ ar galvu; klase 8.8.</text>
<text x="128" y="209" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P06 balsta galvu tēraudā; zem tās paliek 4,4 saplākšņa.</text>
<text x="128" y="216" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P01 0,8; paplāksne 0,2; pašfiksējošs uzgrieznis ap 1.</text>
<text x="128" y="223" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Aiz uzgriežņa vismaz 2 vītnes; pārbaudīt faktisko komplektu.</text>
<text x="128" y="230" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pievilkt krusteniski līdz ciešai saskarei, nesaspiežot koku.</text>
<text x="128" y="237" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">P06 un galva ir redzami, bet neizvirzās virs darba plaknes.</text>
<text x="128" y="244" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Saplākšņa malas, ligzdas un urbumus aizsargāt pret mitrumu.</text>
<text x="128" y="251" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pēc pirmās nedēļas pārbaudīt pievilkumu; ieliktņus neizmantot.</text>
