<text x="132" y="104" font-family="DejaVu Sans" font-size="3" fill="#243441" text-anchor="middle">W01 · biezums 5 · BB uz augšu</text>
<text x="132" y="114" font-family="DejaVu Sans" font-size="2.8" fill="#243441" text-anchor="middle">Augšpusē nav skrūvju vai metāla ielaidumu.</text>
<text x="302" y="57" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">16 KOKSKRŪVES</text>
<text x="302" y="62.6" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Ø0,8 × 4, ar seškanšu galvu.</text>
<text x="302" y="68.2" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Garums 4 zem galvas.</text>
<text x="302" y="73.8" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Katrai parasta paplāksne.</text>
<text x="302" y="79.4" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start"></text>
<text x="302" y="85" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Caurums P01: Ø0,9.</text>
<text x="302" y="90.6" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Kokā priekšurbums no apakšas;</text>
<text x="302" y="96.2" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Ø pēc skrūves ražotāja.</text>
<text x="302" y="101.8" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Dziļums līdz 3,2.</text>
<text x="302" y="107.4" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start"></text>
<text x="302" y="113" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">X=13; 27; 173; 187</text>
<text x="302" y="118.6" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Y=13; 27; 73; 87</text>
<text x="302" y="124.2" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Visas X un Y kombinācijas.</text>
