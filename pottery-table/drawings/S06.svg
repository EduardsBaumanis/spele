<text x="302" y="84.5" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">W01 urbums Ø1,05 cauri.</text>
<text x="302" y="90" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Augšā ligzda P06:</text>
<text x="302" y="95.5" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">4 × 4; dziļums 0,6.</text>
<text x="302" y="101" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start"></text>
<text x="302" y="106.5" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">P06: 4 × 4 × 0,6.</text>
<text x="302" y="112" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Konuss pēc M10 galvas.</text>
<text x="302" y="117.5" font-family="DejaVu Sans" font-size="2.65" fill="#243441" text-anchor="start">Nomināli 90°, Ø2,</text>
