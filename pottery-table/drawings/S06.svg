<text x="32" y="264" font-family="DejaVu Sans" font-size="2.7" fill="#243441" text-anchor="start">Šķērsgriezums 1:1,67</text>
<text x="137" y="207" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">4 cm skrūve − 0,8 P01 − 0,2 paplāksne = 3 cm kokā.</text>
<text x="137" y="214" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Virs skrūves paliek ap 2 cm saplākšņa. Neurbt cauri!</text>
<text x="137" y="221" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Urbja dziļuma ierobežotājs; pirms montāžas izmēģināt atgriezumā.</text>
<text x="137" y="228" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pārnest caurumus pēc pamatnes uzlikšanas uz apgrieztās virsmas.</text>
<text x="137" y="235" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Pievilkt cieši ar rokas atslēgu, neizplēšot vītni kokā.</text>
<text x="137" y="242" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Virsmas svaru nes plāksnes; skrūves to notur vietā.</text>
<text x="137" y="249" font-family="DejaVu Sans" font-size="2.75" fill="#243441" text-anchor="start">Smago galdu celt aiz tērauda pamatnes, nevis saplākšņa malas.</text>
